name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    name: build + test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: select xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: swift version
        run: swift --version

      - name: build
        run: swift build -v

      - name: test
        run: swift test --parallel
