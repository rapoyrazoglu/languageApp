name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "schema/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "schema/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: backend
          args: --timeout=5m

      - name: go test
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: build
        run: go build -o /tmp/api ./cmd/api

  integration:
    name: integration (postgres + minio)
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: langapp
          POSTGRES_PASSWORD: langapp_dev
          POSTGRES_DB: langapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: start minio
        # bitnami/minio is no longer published with `:latest` (Aug 2025 retag);
        # spin minio up manually so we can pin the official image and seed the bucket.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null; then
              echo "minio ready"; break
            fi
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c '
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb -p local/packs
          '

      - name: integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://langapp:langapp_dev@localhost:5432/langapp?sslmode=disable
          INTEGRATION_S3_ENDPOINT: http://localhost:9000
          INTEGRATION_S3_ACCESS_KEY: minioadmin
          INTEGRATION_S3_SECRET_KEY: minioadmin
          INTEGRATION_S3_BUCKET: packs
        run: make test-integration
