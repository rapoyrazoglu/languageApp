name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "schema/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "schema/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: backend
          args: --timeout=5m

      - name: go test
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: build
        run: go build -o /tmp/api ./cmd/api
